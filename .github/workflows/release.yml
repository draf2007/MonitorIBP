# Сборка релиза MonitorIBP: установщик Windows + .deb для Linux.
# Запуск:
#   - метка vX.Y.Z (git tag v1.2.0 && git push origin v1.2.0) → сборка + GitHub Release;
#   - вручную (Actions → Release → Run workflow) → только сборка, пакеты в Artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Версия из .pro (и сверка с меткой) ----------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(sed -n 's/^VERSION *= *//p' MonitorIBP.pro | tr -d '\r ')
          echo "Версия в MonitorIBP.pro: $VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Метка $GITHUB_REF_NAME не совпадает с VERSION = $VERSION в MonitorIBP.pro"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ---------- Windows: MSYS2 + Qt 6.11 + свой net-snmp + Inno Setup 7 ----------
  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Скрипты .sh должны прийти с концами строк LF, иначе bash их не поймёт
      - name: Git без перевода концов строк
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # MSYS2 ставим в C:\msys64 — в MonitorIBP.pro пути к net-snmp прописаны именно туда
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          install: >-
            make perl tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-libtre
            mingw-w64-x86_64-gettext-runtime
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-qt6-svg

      # net-snmp 5.9.5.2 — нет в MSYS2, собираем сами с теми же ключами, что у Андрея.
      # Результат кэшируется: следующие сборки берут готовый архив
      - name: Кэш net-snmp
        id: netsnmp-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\netsnmp-5.9.5.2.tgz
          key: netsnmp-5.9.5.2-mingw64-v1

      - name: Сборка net-snmp 5.9.5.2
        if: steps.netsnmp-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSL -o netsnmp.tar.gz https://github.com/net-snmp/net-snmp/archive/refs/tags/v5.9.5.2.tar.gz
          tar xzf netsnmp.tar.gz
          cd net-snmp-5.9.5.2
          ./configure --prefix=/mingw64 --with-default-snmp-version=1 --disable-agent \
              --disable-embedded-perl --disable-applications --without-perl-modules \
              --with-openssl=/mingw64 --enable-debugging \
              PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          make
          touch /tmp/before-install
          sleep 1
          make install
          # запоминаем в архив всё, что поставил make install
          find /mingw64 -newer /tmp/before-install \( -type f -o -type l \) > /tmp/netsnmp-files.txt
          tar czf /c/netsnmp-5.9.5.2.tgz -T /tmp/netsnmp-files.txt

      # сохраняем сразу, не дожидаясь конца задачи: даже если дальше что-то упадёт,
      # net-snmp второй раз собирать не придётся
      - name: Сохранить net-snmp в кэш
        if: steps.netsnmp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\netsnmp-5.9.5.2.tgz
          key: netsnmp-5.9.5.2-mingw64-v1

      - name: Установка net-snmp из кэша
        if: steps.netsnmp-cache.outputs.cache-hit == 'true'
        run: tar xzf /c/netsnmp-5.9.5.2.tgz -C /

      # Inno Setup 7.1.1 (как у Андрея). Сайт jrsoftware отдаёт роботам HTML вместо exe,
      # поэтому пробуем несколько адресов и проверяем, что скачан именно exe (начинается с "MZ")
      - name: Inno Setup 7
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          $ok = $false
          # в релизе Inno Setup несколько файлов — выбираем 64-битный установщик innosetup-7.x.y-x64.exe
          $assets = gh release view is-7_1_1 -R jrsoftware/issrc --json assets -q '.assets[].name'
          Write-Host "Файлы релиза Inno Setup: $($assets -join ', ')"
          $name = $assets | Where-Object { $_ -match '^innosetup-7[\d.]*-x64\.exe$' } | Select-Object -First 1
          if ($name) {
            gh release download is-7_1_1 -R jrsoftware/issrc -p $name -O $exe --clobber
            if (Test-Path $exe) {
              $head = [System.IO.File]::ReadAllBytes($exe)[0..1]
              $ok = ($head[0] -eq 0x4D -and $head[1] -eq 0x5A)
              Write-Host "Скачано из GitHub Releases: $name"
            }
          }
          if (-not $ok) {
            foreach ($url in @('https://files.jrsoftware.org/is/7/innosetup-7.1.1.exe',
                               'https://jrsoftware.org/download.php/is.exe')) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $exe -UserAgent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
                $head = [System.IO.File]::ReadAllBytes($exe)[0..1]
                if ($head[0] -eq 0x4D -and $head[1] -eq 0x5A) { $ok = $true; Write-Host "Скачано: $url"; break }
                Write-Host "Не exe: $url"
              } catch { Write-Host "Ошибка $url : $_" }
            }
          }
          if (-not $ok) { throw "Не удалось скачать установщик Inno Setup 7" }
          Start-Process -Wait -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/ALLUSERS'
          # 64-битный Inno Setup 7 ставится в Program Files; ищем ISCC.exe (установщик может
          # доработать в фоне — ждём до минуты) и передаём его папку следующим шагам
          $iscc = $null
          for ($i = 0; $i -lt 30 -and -not $iscc; $i++) {
            $iscc = Get-ChildItem 'C:\Program Files\Inno Setup 7', 'C:\Program Files (x86)\Inno Setup 7', "$env:LOCALAPPDATA\Programs\Inno Setup 7" `
                      -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $iscc) { Start-Sleep -Seconds 2 }
          }
          if (-not $iscc) { throw "ISCC.exe не найден после установки Inno Setup" }
          Write-Host "ISCC: $($iscc.FullName)"
          "ISCC_DIR=$($iscc.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Сборка Release
        run: |
          set -euo pipefail
          mkdir -p "$HOME/build-release" && cd "$HOME/build-release"
          qmake6 "$GITHUB_WORKSPACE/MonitorIBP.pro" CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release CONFIG-=qml_debug
          mingw32-make -j"$(nproc)"

      - name: Дистрибутив и установщик
        run: |
          set -euo pipefail
          EXE=$(find "$HOME/build-release" -name MonitorIBP.exe -print -quit)
          # папку Inno Setup — в PATH, make_dist.sh ищет ISCC.exe сначала там
          export PATH="$PATH:$(cygpath -u "$ISCC_DIR")"
          bash "$GITHUB_WORKSPACE/deploy/make_dist.sh" "$EXE"
          ls -l "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/MonitorIBP-${{ needs.version.outputs.version }}-setup.exe
          if-no-files-found: error

  # ---------- Linux: Debian 12 + Qt 6.8.3 (aqt) → .deb ----------
  linux:
    needs: version
    runs-on: ubuntu-latest
    container: debian:12
    env:
      QT_DIR: /opt/Qt/6.8.3/gcc_64
    steps:
      - uses: actions/checkout@v4

      - name: Пакеты Debian
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential libgl-dev libegl-dev libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-util1 libxcb-shape0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libsnmp-dev libssl-dev patchelf dpkg-dev python3 python3-venv ca-certificates

      - name: Кэш Qt 6.8.3
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: /opt/Qt
          key: qt-6.8.3-linux_gcc_64-serialport-shadertools-v1

      - name: Qt 6.8.3 через aqt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv /opt/aqt
          /opt/aqt/bin/pip install --quiet aqtinstall
          /opt/aqt/bin/aqt install-qt linux desktop 6.8.3 linux_gcc_64 \
            -m qtserialport qtshadertools -O /opt/Qt

      - name: Сборка .deb
        run: |
          "$QT_DIR/bin/qmake" -v
          bash deploy/make_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/monitoribp_${{ needs.version.outputs.version }}_amd64.deb
          if-no-files-found: error

  # ---------- GitHub Release (только по метке vX.Y.Z) ----------
  release:
    needs: [version, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Контрольные суммы и релиз
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd out
          sha256sum * > "SHA256SUMS-$VERSION.txt"
          cat "SHA256SUMS-$VERSION.txt"
          # релиз с такой меткой уже есть (метку переставили) — просто заменяем файлы
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" * \
              --repo "$GITHUB_REPOSITORY" \
              --title "Мониторинг ИБП $VERSION" \
              --notes "Установщик для Windows и пакет .deb для Debian 12/13 и Astra Linux 1.8. Qt входит в оба пакета."
          fi
